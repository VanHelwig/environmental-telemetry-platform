apiVersion: v1
kind: Service
metadata:
  name: etp-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: etp-postgres-external
  labels:
    kubernetes.io/service-name: etp-postgres
    endpointslice.kubernetes.io/managed-by: etp-local
addressType: IPv4
ports:
  - name: postgres
    protocol: TCP
    port: 5432
endpoints:
  - addresses:
      - 10.89.0.3
    conditions:
      ready: true