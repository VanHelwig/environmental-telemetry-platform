[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "environmental-telemetry-platform"
version = "0.1.0"
description = "Environmental telemetry ingestion and observability platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a running PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",   # Import and related errors
    "E7",   # Statement errors
    "E9",   # Syntax errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "B",    # Common bug patterns
    "UP",   # Python syntax modernization
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

